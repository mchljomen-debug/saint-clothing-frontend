<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8">

    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0"
    >

    <title>Saint Clothing | Official Online Store</title>

    <meta
      name="description"
      content="Shop Saint Clothing streetwear, shirts, shorts, jerseys, and exclusive releases. Explore the latest collections from Saint Clothing online."
    >

    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#0A0B10">

    <link rel="icon" type="image/png" href="/logo.png">

    <link
      rel="canonical"
      href="https://www.saintclothingbrandph.com/"
    >

    <meta
      property="og:title"
      content="Saint Clothing | Official Online Store"
    >

    <meta
      property="og:description"
      content="Explore the latest Saint Clothing streetwear collections, shirts, shorts, jerseys, and exclusive releases."
    >

    <meta property="og:type" content="website">

    <meta
      property="og:url"
      content="https://www.saintclothingbrandph.com/"
    >

    <meta
      property="og:image"
      content="https://www.saintclothingbrandph.com/logo.png"
    >

    <meta
      property="og:site_name"
      content="Saint Clothing"
    >

    <meta
      name="twitter:card"
      content="summary_large_image"
    >

    <meta
      name="twitter:title"
      content="Saint Clothing | Official Online Store"
    >

    <meta
      name="twitter:description"
      content="Explore the latest Saint Clothing streetwear collections and exclusive releases."
    >

    <meta
      name="twitter:image"
      content="https://www.saintclothingbrandph.com/logo.png"
    >

    <link
      rel="preconnect"
      href="https://res.cloudinary.com"
    >

    <link
      rel="dns-prefetch"
      href="https://res.cloudinary.com"
    >

    <link
      rel="preload"
      as="image"
      href="https://res.cloudinary.com/din1tc6fe/image/upload/f_auto,q_auto,w_1600,c_limit/v1777308650/saint-clothing/hero/fuhvgbo3p1dgibkfzuhj.jpg"
      fetchpriority="high"
    >

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    >

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    >

    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=Outfit:wght@100..900&family=Prata&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    >

    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=Outfit:wght@100..900&family=Prata&display=swap"
      >
    </noscript>

    <style>
      .loading-container{
        display:flex;
        justify-content:center;
        align-items:center;
        width:100%;
        height:100vh;
        min-height:100vh;
        background-color:#0A0B10;
      }

      .main-logo{
        display:block;
        width:300px;
        height:300px;
        object-fit:contain;
        filter:drop-shadow(0 0 15px rgba(126,27,0,0.5));
        animation:pulse 2s infinite;
      }

      @keyframes pulse{
        0%{
          transform:scale(1);
          opacity:.8;
        }

        50%{
          transform:scale(1.05);
          opacity:1;
        }

        100%{
          transform:scale(1);
          opacity:.8;
        }
      }

      @media(prefers-reduced-motion:reduce){
        .main-logo{
          animation:none;
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="loading-container">
        <img
          src="/logo.png"
          alt="Saint Clothing"
          class="main-logo"
          width="300"
          height="300"
        >
      </div>
    </div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

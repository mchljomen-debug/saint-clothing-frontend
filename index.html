<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/png" href="/logo.png" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Saint Clothing | Official Online Store</title>

    <meta
      name="description"
      content="Shop Saint Clothing streetwear, shirts, shorts, jerseys, and exclusive releases. Explore the latest collections from Saint Clothing online."
    />

    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0A0B10" />

    <link
      rel="canonical"
      href="https://www.saintclothingbrandph.com/"
    />

    <meta
      property="og:title"
      content="Saint Clothing | Official Online Store"
    />

    <meta
      property="og:description"
      content="Explore the latest Saint Clothing streetwear collections, shirts, shorts, jerseys, and exclusive releases."
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:url"
      content="https://www.saintclothingbrandph.com/"
    />

    <meta
      property="og:image"
      content="https://www.saintclothingbrandph.com/logo.png"
    />

    <meta
      property="og:site_name"
      content="Saint Clothing"
    />

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Saint Clothing | Official Online Store"
    />

    <meta
      name="twitter:description"
      content="Explore the latest Saint Clothing streetwear collections and exclusive releases."
    />

    <meta
      name="twitter:image"
      content="https://www.saintclothingbrandph.com/logo.png"
    />

    <style>
      .loading-container{
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        background-color:#0A0B10;
      }

      .main-logo{
        width:300px;
        height:auto;
        filter:drop-shadow(0 0 15px rgba(126,27,0,0.5));
        animation:pulse 2s infinite;
      }

      @keyframes pulse{
        0%{
          transform:scale(1);
          opacity:0.8;
        }

        50%{
          transform:scale(1.05);
          opacity:1;
        }

        100%{
          transform:scale(1);
          opacity:0.8;
        }
      }

      @media(prefers-reduced-motion:reduce){
        .main-logo{
          animation:none;
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="loading-container">
        <img
          src="/logo.png"
          alt="Saint Clothing"
          class="main-logo"
          width="300"
          height="300"
        />
      </div>
    </div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
